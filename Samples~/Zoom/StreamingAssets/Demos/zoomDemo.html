<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ceffy Zoom Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1a;
      --panel: rgba(17, 24, 39, 0.88);
      --panel-border: rgba(96, 165, 250, 0.18);
      --ink: #eff6ff;
      --muted: #9fb0c8;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(96, 165, 250, 0.16), transparent 30%),
        linear-gradient(180deg, #08101c 0%, #0d1727 100%);
      color: var(--ink);
    }

    body {
      padding: 32px 20px 48px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
    }

    .hero,
    .samples {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .hero {
      padding: 28px;
      margin-bottom: 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #bfdbfe;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.05;
    }

    .intro {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid rgba(147, 197, 253, 0.28);
      border-radius: 999px;
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      color: white;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    .samples {
      padding: 24px;
      display: grid;
      gap: 14px;
    }

    .sample {
      padding: 18px 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .sample-label {
      margin-bottom: 10px;
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sample-text {
      margin: 0;
      line-height: 1.3;
      color: #f8fbff;
      word-break: break-word;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 12px 28px;
      }

      .hero,
      .samples {
        border-radius: 16px;
      }

      .hero {
        padding: 20px;
      }

      .samples {
        padding: 16px;
      }

      .sample {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">Zoom Demo</div>
      <h1>Random text at different sizes</h1>
      <p class="intro">
        This sample keeps the layout simple so it is easy to test zooming and visual scaling.
        Press the button to reshuffle the content and regenerate fresh text samples.
      </p>
      <div class="toolbar">
        <button id="shuffleButton" type="button">Shuffle Samples</button>
        <div class="note">Designed as a lightweight page for zoom and readability checks.</div>
      </div>
    </section>

    <section class="samples" id="samples"></section>
  </main>

  <script>
    const samplesEl = document.getElementById("samples");
    const shuffleButton = document.getElementById("shuffleButton");

    const fragments = [
      "Velvet comets drift across the quiet horizon.",
      "Paper lanterns glow softly above the market stalls.",
      "The glass elevator hums like a distant cello.",
      "Moss grows patiently between the old stone steps.",
      "A silver train slips through the rain before sunrise.",
      "Tiny sparks dance along the edge of the skyline.",
      "The lake reflects every cloud with impossible precision.",
      "Warm bread and coffee reshape the whole morning.",
      "An orange kite rises and vanishes into clean blue air.",
      "Streetlights flicker while the city wakes one block at a time.",
      "The museum hall answers footsteps with a gentle echo.",
      "A notebook page curls upward in the afternoon breeze."
    ];

    const sizes = [14, 18, 24, 32, 42, 56];

    function randomSentence() {
      const first = fragments[Math.floor(Math.random() * fragments.length)];
      const second = fragments[Math.floor(Math.random() * fragments.length)];
      return first === second ? first : first + " " + second;
    }

    function renderSamples() {
      samplesEl.innerHTML = "";

      sizes.forEach((size, index) => {
        const card = document.createElement("article");
        card.className = "sample";

        const label = document.createElement("div");
        label.className = "sample-label";
        label.textContent = "Sample " + (index + 1) + " - " + size + "px";

        const text = document.createElement("p");
        text.className = "sample-text";
        text.textContent = randomSentence();
        text.style.fontSize = size + "px";

        card.appendChild(label);
        card.appendChild(text);
        samplesEl.appendChild(card);
      });
    }

    shuffleButton.addEventListener("click", renderSamples);
    renderSamples();
  </script>
</body>
</html>
